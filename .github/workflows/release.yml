name: Release

# Builds the Windows app from this repository's source and publishes it as a
# GitHub Release whenever a version tag such as v1.0.0 is pushed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Lapis for Windows x64
        run: ./scripts/build-win.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          SHA=$(sha256sum dist/Lapis-win-x64.zip | cut -d' ' -f1)
          cp .github/release-notes.md notes.md
          printf '\nSHA-256 of `Lapis-win-x64.zip`: `%s`\n' "$SHA" >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Lapis-win-x64.zip --clobber
          else
            gh release create "$TAG" dist/Lapis-win-x64.zip --title "Lapis ${TAG#v}" --notes-file notes.md
          fi
