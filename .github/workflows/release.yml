name: Release

# Builds Lapis from this repository's source and publishes a GitHub Release with:
#   Lapis-Setup-<version>.exe (+ .blockmap, latest.yml)  per-user installer that updates itself
#   Lapis-win-x64.zip                                    portable folder, updated by hand
# Runs when a version tag such as v1.1.0 is pushed, or from the Actions tab with
# "Run workflow" (it then creates the tag on the current commit). The tag must
# match the version in package.json.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish; must match package.json, e.g. v1.1.0'
        required: true

# Least privilege: jobs can only read the repo, except the final publish step.
permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  check-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Tag matches package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null && [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::Tag $TAG already exists. Bump the version in package.json first."; exit 1
          fi
      # Nothing is built or published unless every test passes.
      - name: Automatic tests (dates, streaks, translations, settings, artwork)
        run: node --test test/*.test.js

  installer:
    needs: check-version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Meeting detection works on Windows
        run: node scripts/check-quiet.cjs
      - name: Native helper is unpacked next to the app
        shell: pwsh
        run: |
          $f = "dist/installer/win-unpacked/resources/app.asar.unpacked/node_modules/@koromix/koffi-win32-x64/win32_x64/koffi.node"
          if (-not (Test-Path $f)) { throw "koffi.node missing from the installer build" }
          Write-Host "Found $f"
      - name: Smoke test (fuses are set and the hardened app starts)
        shell: pwsh
        run: |
          $exe = "dist/installer/win-unpacked/Lapis.exe"
          node node_modules/@electron/fuses/dist/bin.js read --app $exe
          $p = Start-Process $exe -ArgumentList '--hidden' -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "Lapis exited early (code $($p.ExitCode)); not publishing" }
          Get-Process Lapis -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "Lapis started and stayed running."
      - name: Self-test (the packaged app can run its meeting checks)
        shell: pwsh
        run: |
          Start-Sleep -Seconds 2
          $p = Start-Process "dist/installer/win-unpacked/Lapis.exe" -ArgumentList '--self-test' -PassThru
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw "self-test did not finish" }
          $f = Join-Path $env:APPDATA 'Lapis/self-test.json'
          if (-not (Test-Path $f)) { throw "self-test wrote no result" }
          Get-Content $f
          $j = Get-Content $f | ConvertFrom-Json
          if ($j.state -lt 1 -or $j.state -gt 7) { throw "full-screen check did not run in the packaged app" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: |
            dist/installer/Lapis-Setup-*.exe
            dist/installer/Lapis-Setup-*.exe.blockmap
            dist/installer/latest.yml
          if-no-files-found: error

  portable:
    needs: check-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Build the portable zip
        run: ./scripts/build-win.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable
          path: dist/Lapis-win-x64.zip
          if-no-files-found: error

  publish:
    needs: [installer, portable]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          {
            cat .github/release-notes.md
            echo
            echo "SHA-256 checksums:"
            echo
            echo '```'
            (cd out && sha256sum Lapis-Setup-*.exe Lapis-win-x64.zip)
            echo '```'
          } > notes.md
          gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "Lapis ${TAG#v}" --notes-file notes.md

  # Optional: the same version for the Microsoft Store. Off unless the repository variable
  # STORE_AUTO_SEND is "build" (only build the package, for uploading by hand), "draft" (upload
  # and wait for a person to press Submit) or "submit" (also submit for certification).
  store:
    needs: publish
    if: vars.STORE_AUTO_SEND == 'build' || vars.STORE_AUTO_SEND == 'draft' || vars.STORE_AUTO_SEND == 'submit'
    permissions:
      contents: read
    uses: ./.github/workflows/store.yml
    with:
      send: ${{ vars.STORE_AUTO_SEND }}
    secrets:
      STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
      STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
      STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
      STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
