name: Release

# Builds Lapis from this repository's source and publishes a GitHub Release with:
#   Lapis-Setup-<version>.exe (+ .blockmap, latest.yml)  per-user installer that updates itself
#   Lapis-win-x64.zip                                    portable folder, updated by hand
# Runs when a version tag such as v1.1.0 is pushed, or from the Actions tab with
# "Run workflow" (it then creates the tag on the current commit). The tag must
# match the version in package.json.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish; must match package.json, e.g. v1.1.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  check-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Tag $TAG already exists. Bump the version in package.json first."; exit 1
          fi

  installer:
    needs: check-version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v5
        with:
          name: installer
          path: |
            dist/installer/Lapis-Setup-*.exe
            dist/installer/Lapis-Setup-*.exe.blockmap
            dist/installer/latest.yml
          if-no-files-found: error

  portable:
    needs: check-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the portable zip
        run: ./scripts/build-win.sh
      - uses: actions/upload-artifact@v5
        with:
          name: portable
          path: dist/Lapis-win-x64.zip
          if-no-files-found: error

  publish:
    needs: [installer, portable]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          {
            cat .github/release-notes.md
            echo
            echo "SHA-256 checksums:"
            echo
            echo '```'
            (cd out && sha256sum Lapis-Setup-*.exe Lapis-win-x64.zip)
            echo '```'
          } > notes.md
          gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "Lapis ${TAG#v}" --notes-file notes.md
