name: Release

# Builds the Windows app from this repository's source and publishes it as a
# GitHub Release. Runs when a version tag such as v1.0.1 is pushed, or from the
# Actions tab with "Run workflow" (it then creates the tag on the current commit).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish, e.g. v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  windows-zip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build Lapis for Windows x64
        run: ./scripts/build-win.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          SHA=$(sha256sum dist/Lapis-win-x64.zip | cut -d' ' -f1)
          cp .github/release-notes.md notes.md
          printf '\nSHA-256 of `Lapis-win-x64.zip`: `%s`\n' "$SHA" >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Lapis-win-x64.zip --clobber
          else
            gh release create "$TAG" dist/Lapis-win-x64.zip --target "$GITHUB_SHA" --title "Lapis ${TAG#v}" --notes-file notes.md
          fi
