name: iOS simulator build

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ios-simulator.yml
      - mobile/**

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Select the Liquid Glass SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          test "$(xcodebuild -version | sed -n 's/^Xcode //p' | cut -d. -f1)" -ge 26
      - name: Install JavaScript dependencies
        working-directory: mobile
        run: npm ci
      - name: Generate iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install
      - name: Install iOS pods
        working-directory: mobile/ios
        run: pod install --repo-update
      - name: Build simulator app
        run: |
          xcodebuild \
            -workspace mobile/ios/LapisStretch.xcworkspace \
            -scheme LapisStretch \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/lapis-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package for Appetize
        run: |
          tar -C "$RUNNER_TEMP/lapis-derived/Build/Products/Release-iphonesimulator" \
            -czf "$RUNNER_TEMP/lapis-ios-liquid-glass.tar.gz" LapisStretch.app
          tar -tzf "$RUNNER_TEMP/lapis-ios-liquid-glass.tar.gz" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: lapis-ios-liquid-glass-xcode26
          path: ${{ runner.temp }}/lapis-ios-liquid-glass.tar.gz
          if-no-files-found: error
          retention-days: 14
